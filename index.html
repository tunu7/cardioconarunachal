<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Meta -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="description"
      content="CardioCon — Advancing cardiovascular health through knowledge, innovation, collaboration, and clinical excellence."
    />
    <meta
      name="keywords"
      content="CardioCon, cardiology, cardiovascular, cardiology conference, heart health, medical conference, healthcare, cardiologists"
    />
    <meta name="author" content="CardioCon" />

    <!-- Theme -->
    <meta name="theme-color" content="#0B5C75" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CardioCon" />
    <meta property="og:title" content="CardioCon | Advancing Cardiovascular Care" />
    <meta
      property="og:description"
      content="Connect. Learn. Innovate. Join CardioCon for a premier cardiovascular conference bringing together experts, clinicians, researchers, and innovators."
    />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CardioCon | Advancing Cardiovascular Care" />
    <meta
      name="twitter:description"
      content="A platform for cardiovascular experts, clinicians, researchers, and innovators to connect, learn, and shape the future of heart care."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- SEO -->
    <meta name="robots" content="index, follow" />

    <!-- Performance -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Page Title -->
    <title>CardioCon | Advancing Cardiovascular Care</title>
  </head>

    <noscript>
      CardioCon requires JavaScript to provide the full website experience.
    </noscript>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
